<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Onboarding Assistant</title>

    <link rel="stylesheet" href="./taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>

  <body>
    <main class="app">
        <section class="hero">
        <div class="logo-container">
            <img src="../../assets/logo.png" alt="tagesklinik | bern" />
        </div>
        <div>
            <h1>Onboarding Assistant</h1>
            <p>tagesklinik | bern</p>
        </div>
        </section>

        <section class="card">
        <div class="section-heading">
            <h2>Personendaten</h2>
            <p>Diese Angaben werden in die Platzhalter des Dokuments übernommen.</p>
        </div>
        <p id="statusMessage" class="status" role="status"></p>

        <label for="gender">Geschlecht <span class="required">*</span></label>
        <select id="gender">
            <option value="">Bitte auswählen</option>
            <option value="frau">Frau</option>
            <option value="mann">Mann</option>
        </select>

        <label for="title">Titel</label>
        <input id="title" type="text" placeholder="z. B. Dr. med." />
        <p class="field-hint">Optional. Wird automatisch mit Leerzeichen vor dem Nachnamen eingefügt.</p>

        <label for="firstName">Vorname <span class="required">*</span></label>
        <input id="firstName" type="text" placeholder="Vorname" />

        <label for="lastName">Nachname <span class="required">*</span></label>
        <input id="lastName" type="text" placeholder="Nachname" />

        <button id="createDocument" type="button">Dokument erstellen</button>
        <button id="resetForm" class="secondary-button" type="button">Zurücksetzen</button>

        <p class="form-note">Pflichtfelder sind mit <span class="required">*</span> gekennzeichnet.</p>
        </section>
    </main>
  </body>
</html>
